services:
  # CineBook Backend Express Web Service
  - type: web
    name: cinebook-backend
    runtime: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 5000
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_sampleKey
      - key: RAZORPAY_KEY_SECRET
        value: sampleSecretKey
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
